version: "3.9"

services:
  # 1. Main Next.js Web Portal & National Command Center
  nirnay-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirnay-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AI_ENGINE_URL=http://nirnay-ai-engine:8000
      - GOV_CORE_URL=http://nirnay-gov-core:8080
      - NEXT_PUBLIC_AI_ENGINE_URL=http://nirnay-ai-engine:8000
      - NEXT_PUBLIC_GOV_CORE_URL=http://nirnay-gov-core:8080
      - NEXT_PUBLIC_EDGE_GATEWAY_URL=http://nirnay-edge-gateway:9000
      - NEXT_PUBLIC_MEDIAMTX_URL=http://nirnay-mediamtx:8889
      - NEXT_PUBLIC_DEMO_MODE=true
    depends_on:
      - nirnay-ai-engine
      - nirnay-gov-core
      - nirnay-edge-gateway
    networks:
      - nirnay-net

  # 2. Python AI & Computer Vision Microservice (FastAPI + PyTorch/YOLO/InsightFace)
  nirnay-ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: nirnay-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    networks:
      - nirnay-net

  # 3. Java Enterprise Gov Core (Spring Boot 3.2 + OpenJDK 21)
  nirnay-gov-core:
    build:
      context: ./services/gov-core
      dockerfile: Dockerfile
    container_name: nirnay-gov-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - nirnay-net

  # 4. C++20 Edge Surveillance Gateway (RTSP / ONVIF Ingestor & Frame Hash)
  nirnay-edge-gateway:
    build:
      context: ./services/edge-streamer
      dockerfile: Dockerfile
    container_name: nirnay-edge-gateway
    restart: unless-stopped
    ports:
      - "9000:9000"
    networks:
      - nirnay-net

  # 5. MediaMTX WebRTC & RTSP Live Video Streamer
  nirnay-mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: nirnay-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "1935:1935"     # RTMP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC
      - "8889:8889/udp" # WebRTC UDP
    environment:
      - MTX_PROTOCOLS=tcp
      - MTX_WEBRTCADDRES=:8889
      - MTX_LOGLEVEL=info
    networks:
      - nirnay-net

  # 6. Redis Message Queue & Real-time Biometric Cache
  nirnay-redis:
    image: redis:7-alpine
    container_name: nirnay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nirnay-net

networks:
  nirnay-net:
    driver: bridge
